[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../node_modules"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
ffi = false

remappings = [
  "@openzeppelin/=../node_modules/@openzeppelin/"
]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 64
fail_on_revert = false
